services:
  srs-media-server:
    image: ossrs/srs:5
    container_name: srs-media-server
    restart: always
    # Sinh conf/srs.conf từ template, thay __BACKEND_URL__ bằng biến BACKEND_URL
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s#__BACKEND_URL__#$$BACKEND_URL#g" conf/srs.conf.tpl > conf/srs.conf && exec ./objs/srs -c conf/srs.conf
    ports:
      - "1935:1935"      # RTMP Ingest (từ OBS)
      - "1985:1985"      # SRS HTTP API / WebRTC Signaling
      - "1990:1990"      # SRS HTTPS API
      - "8080:8080"      # HLS / HTTP Server phân phối video
      - "8088:8088"      # HLS / HTTPS Server
      - "443:8088"       # Port HTTPS chuẩn (WebRTC SDK mặc định gọi port 443)
      - "8000:8000/udp"  # WebRTC Media Transport qua UDP
    environment:
      # Địa chỉ IP để client WebRTC (điện thoại/web) kết nối tới
      - CANDIDATE=${CANDIDATE:-192.168.1.204}
      # Backend Go chạy trên Azure Container Apps (xác thực stream key & kết thúc phiên live)
      - BACKEND_URL=${BACKEND_URL:-https://demo-webtraiga.proudsky-59d95604.southeastasia.azurecontainerapps.io}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "backend:host-gateway"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf.tpl:ro
      - ./rtc_publisher.html:/usr/local/srs/objs/nginx/html/players/rtc_publisher.html
      - ./rtc_publisher.html:/usr/local/srs/objs/nginx/html/rtc_publisher.html

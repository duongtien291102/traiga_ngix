name: Validate infra configs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Check configs syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet

  deploy:
    name: Deploy SRS configuration to VPS
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.SRS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull config and restart SRS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/traiga
            git pull --ff-only
            docker compose pull srs
            docker compose up -d --force-recreate srs
            docker image prune -f

name: Validate infra configs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Check configs syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet


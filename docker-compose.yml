# ==============================================================================
# PRODUCTION STACK - chạy trên VPS (CHỈ CHẠY SRS MEDIA SERVER)
#   - Backend: chạy trên Azure Container Apps (repo traiga_be) -> KHÔNG có ở đây
#   - Frontend: chạy trên Vercel (repo traiga_fe) -> KHÔNG có ở đây
#   - SRS: media server (cần RTMP & UDP nên chạy trên VPS)
# Địa chỉ backend cấu hình qua biến BACKEND_URL trong .env
# ==============================================================================
services:
  # SRS 5 Media Server (RTMP ingest, HLS & WebRTC)
  srs:
    image: ossrs/srs:5
    container_name: traiga-srs
    restart: always
    # Sinh conf/srs.conf từ template, thay __BACKEND_URL__ bằng biến BACKEND_URL
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p ./objs/nginx/html/record/live
        (while true; do find ./objs/nginx/html/record -type f -name "*.mp4" -mmin +180 -delete 2>/dev/null; sleep 600; done) &
        sed -e "s#__BACKEND_URL__#$$BACKEND_URL#g" -e "s#__SRS_WEBHOOK_SECRET__#$$SRS_WEBHOOK_SECRET#g" conf/srs.conf.tpl > conf/srs.conf && exec ./objs/srs -c conf/srs.conf
    ports:
      - "1935:1935"      # RTMP ingest (OBS, vMix)
      - "8080:8080"      # SRS HTTP (HLS & WebRTC signaling)
      - "8088:8088"      # SRS HTTPS (HLS & WebRTC publish trực tiếp)
      - "8000:8000/udp"  # WebRTC media (UDP)
    environment:
      - CANDIDATE=${CANDIDATE}                   # IP public của VPS
      - BACKEND_URL=${BACKEND_URL}               # URL backend Azure (webhook xác thực stream key)
      - SRS_WEBHOOK_SECRET=${SRS_WEBHOOK_SECRET} # Secret xác thực SRS Webhook với Backend
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf.tpl:ro
      - ./certs/server.crt:/usr/local/srs/conf/server.crt:ro
      - ./certs/server.key:/usr/local/srs/conf/server.key:ro
      - ./rtc_publisher.html:/usr/local/srs/objs/nginx/html/players/rtc_publisher.html:ro
      - ./rtc_publisher.html:/usr/local/srs/objs/nginx/html/rtc_publisher.html:ro
    networks:
      - live_network

networks:
  live_network:
    driver: bridge

services:
  srs-media-server:
    image: ossrs/srs:5
    container_name: srs-media-server
    restart: always
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "1935:1935"      # RTMP Ingest (từ OBS)
      - "1985:1985"      # SRS HTTP API / WebRTC Signaling
      - "1990:1990"      # SRS HTTPS API
      - "8080:8080"      # HLS / HTTP Server phân phối video
      - "8088:8088"      # HLS / HTTPS Server
      - "443:8088"       # Port HTTPS chuẩn (WebRTC SDK mặc định gọi port 443)
      - "8000:8000/udp"  # WebRTC Media Transport qua UDP
    environment:
      # Địa chỉ IP để client WebRTC (điện thoại/web) kết nối tới
      - CANDIDATE=${CANDIDATE:-192.168.1.48}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "backend:host-gateway"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf
      - ./srs.conf:/usr/local/srs/conf/docker.conf
      - ./rtc_publisher.html:/usr/local/srs/objs/nginx/html/players/rtc_publisher.html
      - ./rtc_publisher.html:/usr/local/srs/objs/nginx/html/rtc_publisher.html

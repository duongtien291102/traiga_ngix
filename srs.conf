# SRS 5.0 (Simple Realtime Server) Configuration
# Kiến trúc Livestream Lai: Hỗ trợ WebRTC, RTMP và HLS

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# SRS HTTP API (dùng cho WebRTC signaling và điều khiển)
http_api {
    enabled         on;
    listen          8080;
    crossdomain     on;
    https {
        enabled     on;
        listen      8088;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# SRS HTTP Server (dùng phân phối HLS / HTTP-FLV)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
    https {
        enabled     on;
        listen      8088;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# Cấu hình WebRTC Server
rtc_server {
    enabled         on;
    listen          8000; # UDP port
    # Địa chỉ IP của máy chủ để client WebRTC (Mobile/Web) kết nối
    candidate       $CANDIDATE;
}

# Vhost mặc định
vhost __defaultVhost__ {
    # 1. Cấu hình WebRTC: nhận luồng WebRTC và tự động chuyển đổi sang RTMP
    rtc {
        enabled         on;
        rtc_to_rtmp     on;
        rtmp_to_rtc     on;
        pli_for_rtmp    2.0;
        bframe          discard;
    }

    # 2. Cấu hình HLS: phân đoạn 3s, lưu đệm 60s, đợi keyframe chuẩn, tắt session ctx query
    hls {
        enabled         on;
        hls_fragment    3;
        hls_window      60;
        hls_wait_keyframe on;
        hls_ctx         off;
        hls_ts_ctx      off;
        hls_cleanup     on;
        hls_dispose     120;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # 3. Webhook xác thực Stream Key qua Golang Backend
    http_hooks {
        enabled         on;
        # __BACKEND_URL__ được thay bằng biến môi trường BACKEND_URL khi container khởi động
        on_publish      __BACKEND_URL__/auth;
        on_unpublish    __BACKEND_URL__/auth/unpublish;
    }
}

# SRS 6.0 (Simple Realtime Server) Configuration
# Kiến trúc Livestream Lai: Hỗ trợ WebRTC, RTMP và HLS

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# SRS HTTP API (dùng cho WebRTC signaling và điều khiển)
http_api {
    enabled         on;
    listen          8080;
    crossdomain     on;
    https {
        enabled     on;
        listen      8088;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# SRS HTTP Server (dùng phân phối HLS / HTTP-FLV)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
    https {
        enabled     on;
        listen      8088;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# Cấu hình WebRTC Server
rtc_server {
    enabled         on;
    listen          8000; # UDP port
    # Địa chỉ IP của máy chủ để client WebRTC (Mobile/Web) kết nối
    candidate       $CANDIDATE;
}

# Vhost mặc định
vhost __defaultVhost__ {
    # 1. Cấu hình WebRTC: nhận luồng WebRTC và tự động chuyển đổi sang RTMP
    rtc {
        enabled         on;
        rtc_to_rtmp     on;
        rtmp_to_rtc     on;
        pli_for_rtmp    1.0;    # Yêu cầu keyframe mỗi 1.0s để giảm độ trễ HLS/DVR và khởi tạo hình ảnh tức thì
        bframe          discard;
        aac_bitrate     128000; # Tăng chất lượng âm thanh chuyển đổi từ 48k lên 128k (trong trẻo, hết dè/bí tiếng)
    }

    # Đồng bộ âm thanh và hình ảnh xuất phát cùng lúc từ 0ms (giữ nguyên nhịp RTP gốc, không bóp méo delta > 250ms)
    time_jitter         zero;

    # Chống rớt luồng và đóng file ghi hình DVR nhanh gọn khi dừng phát sóng
    publish {
        mr                  off;
        firstpkt_timeout    20000;  # Chờ gói tin đầu tiên tối đa 20s
        normal_timeout      7000;   # Đóng luồng sau 7s khi ngắt kết nối để xuất file DVR kịp thời
    }

    # Optional ABR ladder. Enable with ABR_ENABLED=on after checking VPS CPU capacity.
    # Output is written to a separate app so transcode publishers do not recurse.
    transcode live {
        enabled         on;
        ffmpeg          /usr/bin/ffmpeg;

        engine 720p {
            enabled     __ABR_ENABLED__;
            vcodec      libx264;
            vbitrate    2500;
            vfps        60;
            vwidth      1280;
            vheight     720;
            vthreads    2;
            vpreset     veryfast;
            vfilter {
                vf      scale=1280:720:force_original_aspect_ratio=decrease:force_divisible_by=2,pad=1280:720:(ow-iw)/2:(oh-ih)/2;
            }
            vparams {
                g               120;
                keyint_min      120;
                sc_threshold    0;
            }
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/abr?vhost=[vhost]/[stream]_[engine];
        }

        engine 480p {
            enabled     __ABR_ENABLED__;
            vcodec      libx264;
            vbitrate    1000;
            vfps        60;
            vwidth      854;
            vheight     480;
            vthreads    2;
            vpreset     veryfast;
            vfilter {
                vf      scale=854:480:force_original_aspect_ratio=decrease:force_divisible_by=2,pad=854:480:(ow-iw)/2:(oh-ih)/2;
            }
            vparams {
                g               120;
                keyint_min      120;
                sc_threshold    0;
            }
            acodec          aac;
            abitrate        96;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/abr?vhost=[vhost]/[stream]_[engine];
        }

        engine 360p {
            enabled     __ABR_ENABLED__;
            vcodec      libx264;
            vbitrate    600;
            vfps        60;
            vwidth      640;
            vheight     360;
            vthreads    1;
            vpreset     veryfast;
            vfilter {
                vf      scale=640:360:force_original_aspect_ratio=decrease:force_divisible_by=2,pad=640:360:(ow-iw)/2:(oh-ih)/2;
            }
            vparams {
                g               120;
                keyint_min      120;
                sc_threshold    0;
            }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/abr?vhost=[vhost]/[stream]_[engine];
        }
    }

    exec {
        enabled         on;
        publish         /bin/sh /usr/local/bin/write-hls-master.sh [app] [stream];
    }

    # 2. Cấu hình HLS: phân đoạn 1s để giảm độ trễ xem trực tiếp, đợi keyframe chuẩn.
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      60;
        hls_wait_keyframe on;
        hls_ctx         off;
        hls_ts_ctx      off;
        hls_cleanup     on;
        hls_dispose     10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # 3. Cấu hình DVR: tự động ghi lại phiên live thành file .mp4 để đẩy lên Google Drive
    dvr {
        enabled             on;
        dvr_apply           all;
        dvr_plan            session;
        dvr_path            ./objs/nginx/html/record/[app]/[stream].[timestamp].mp4;
        dvr_wait_keyframe   on;    # Cho video keyframe dau tien de video va audio khop nhau tu 0s

        time_jitter         zero;  # Giu nguyen moc thoi gian thuc A/V tu 0ms, tranh loi time_jitter full lam lech tieng
    }

    # 4. Webhook xác thực Stream Key & nhận file ghi hình DVR qua Golang Backend
    http_hooks {
        enabled         on;
        # __BACKEND_URL__ và __SRS_WEBHOOK_SECRET__ được thay bằng biến môi trường khi container khởi động
        on_publish      __BACKEND_URL__/auth?secret=__SRS_WEBHOOK_SECRET__;
        on_unpublish    __BACKEND_URL__/auth/unpublish?secret=__SRS_WEBHOOK_SECRET__;
        on_dvr          __BACKEND_URL__/auth/dvr?secret=__SRS_WEBHOOK_SECRET__;
    }
}
